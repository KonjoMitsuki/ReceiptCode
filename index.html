<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#0d5b4a" />
    <meta
      name="description"
      content="レシートを端末内でOCRし、JANコードのバーコードを表示する店舗スタッフ向けツール"
    />
    <script>
      // Apply the M3E color mode before first paint (storageKey of ColorModeProvider).
      try {
        const mode = localStorage.getItem('color-mode') || 'system';
        const dark =
          mode === 'dark' ||
          (mode === 'system' &&
            matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.add(dark ? 'dark' : 'light');
      } catch {}
    </script>
    <title>Receipt2JAN</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
